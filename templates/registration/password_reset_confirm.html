{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2>Confirm Password Change</h2>

    <p>
        Enter New Password.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">
            Change Password
        </button>
    </form>

</div>

{% endblock %}
