{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <h3>Leave a Review for {{ product.name }}</h3>

    {% comment %} <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Rating</label>
            <select name="rating" class="form-control" required>
                <option value="">Select rating</option>
                <span class="text-secondary font-weight-bold">
                {% for i in "12345" %}
                    <option value="{{ i }}">{{ i }} *</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Comment</label>
            <textarea name="comment" class="form-control" row="4" required></textarea>
        </div>
        </br></br></br>
    
        <button class="btn btn-dark">Submit Review</button>
        </br></br></br>
    </form> {% endcomment %}
    <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Rating</label>
        <div class="star-rating">
            <input type="hidden" name="rating" id="ratingValue" value="" required>
            <div class="stars-container">
                <i class="star" data-value="1">☆</i>
                <i class="star" data-value="2">☆</i>
                <i class="star" data-value="3">☆</i>
                <i class="star" data-value="4">☆</i>
                <i class="star" data-value="5">☆</i>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Comment</label>
        <textarea name="comment" class="form-control" rows="4" required></textarea>
    </div>
    <br><br><br>

    <button type="submit" class="btn btn-submit">Submit Review</button>
</form>
</div>

<script>
    // Star Rating JavaScript (Bootstrap 4 compatible)
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('ratingValue');
    
    stars.forEach(star => {
        star.addEventListener('click', function() {
            const value = this.getAttribute('data-value');
            ratingInput.value = value;
            
            // Update active stars
            stars.forEach(s => {
                if (s.getAttribute('data-value') <= value) {
                    s.classList.add('active');
                    s.textContent = '★';  // Filled star
                } else {
                    s.classList.remove('active');
                    s.textContent = '☆';  // Empty star
                }
            });
        });
        
        // Hover effect
        star.addEventListener('mouseenter', function() {
            const value = this.getAttribute('data-value');
            stars.forEach(s => {
                if (s.getAttribute('data-value') <= value) {
                    s.style.color = '#ffc107';
                } else {
                    s.style.color = '#ced4da';
                }
            });
        });
    });
    
    // Reset hover on mouse leave
    const container = document.querySelector('.stars-container');
    if (container) {
        container.addEventListener('mouseleave', function() {
            const currentRating = ratingInput.value;
            stars.forEach(s => {
                if (currentRating && s.getAttribute('data-value') <= currentRating) {
                    s.style.color = '#ffc107';
                    s.textContent = '★';
                } else {
                    s.style.color = '#ced4da';
                    s.textContent = '☆';
                }
            });
        });
    }
</script>

{% endblock %}
